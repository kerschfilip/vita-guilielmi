<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        }
    }
    ---
    
    <nav class="unit-nav">
        <button id="prev-unit" onclick="navigateUnit(-1)">← Předchozí</button>
        <select id="unit-select" onchange="goToUnit(this.value)">
            <option value="01">Unit 01 — Prologus / Praefatio</option>
            <option value="02">Unit 02 — Incipit &amp; pueritia</option>
            <option value="03">Unit 03 — Peregrinatio &amp; faber</option>
            <option value="04">Unit 04 — Circuli ferrei</option>
            <option value="05">Unit 05 — Miraculum caeci</option>
            <option value="06">Unit 06 — Vocatio &amp; ignis</option>
            <option value="07">Unit 07 — Lorica &amp; cophia</option>
            <option value="08">Unit 08 — Fons &amp; ursus</option>
            <option value="09">Unit 09 — Edificatio ecclesiae</option>
        </select>
        <button id="next-unit" onclick="navigateUnit(1)">Další →</button>
    </nav>
    
    <main class="synoptic-grid">
        <section class="witness-pane">
            <header><h2>Codex 1 (13. století)</h2></header>
            <div id="content-ms" class="witness-content">Načítání…</div>
        </section>
        <section class="witness-pane">
            <header><h2>Renda (1581)</h2></header>
            <div id="content-renda" class="witness-content">Načítání…</div>
        </section>
    </main>
    
    <style>
        .unit-nav {
            display: flex; justify-content: center; align-items: center;
            gap: 1rem; padding: 1rem;
            background: #f5f5f5; border-bottom: 1px solid #ddd;
        }
        .unit-nav button {
            padding: .4rem .8rem; background: white;
            border: 1px solid #999; border-radius: 4px; cursor: pointer;
        }
        .unit-nav button:disabled { opacity: .4; cursor: not-allowed; }
        .unit-nav select { padding: .4rem; min-width: 280px; }
        .synoptic-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 2rem; padding: 1.5rem;
            max-width: 1600px; margin: 0 auto;
        }
        .witness-pane {
            border-left: 3px solid #999; padding-left: 1rem; min-width: 0;
        }
        .witness-pane &gt; header h2 {
            margin-top: 0; color: #555; font-size: 1.2em; font-weight: normal;
            border-bottom: 1px solid #eee; padding-bottom: .5rem;
        }
        /* Segment color coding (mirror of ODD outputRendition) */
        .tei-seg1 { background-color: #bdb2ff; padding: 0 .15em; border-radius: 3px; }
        .tei-seg2 { background-color: #a8eab3; padding: 0 .15em; border-radius: 3px; }
        .tei-seg3 { background-color: #d4a574; padding: 0 .15em; border-radius: 3px; }
        .tei-seg4 { background-color: #ffd6a5; padding: 0 .15em; border-radius: 3px; }
        .tei-seg5 { background-color: #caffbf; padding: 0 .15em; border-radius: 3px; }
        .tei-seg6 { background-color: #ffadad; padding: 0 .15em; border-radius: 3px; }
        .tei-seg7 { background-color: #e0e0e0; padding: 0 .15em; border-radius: 3px; }
        .tei-note1 { font-size: .85em; color: #555; font-style: italic; border-left: 2px solid #bbb; padding-left: .4em; margin: .4em 0; }
    </style>
    
    <script>
    /*  */
        var MIN_UNIT = 1, MAX_UNIT = 9;
        var DOC_PATH = 'vita-guilielmi/vita-guilielmi.xml';
        var ODD = 'vita-guilielmi';
        var BASE_URL = '/exist/apps/vita-guilielmi';
        
        function padUnit(n) { return String(n).padStart(2, '0'); }
        
        function currentUnit() {
            return new URLSearchParams(window.location.search).get('n') || '01';
        }
        
        function loadWitness(elementId, witnessId, unit) {
            var xpath = "//tei:text[@xml:id='" + witnessId + "']//tei:div[@type='unit'][@n='" + unit + "']";
            var url = BASE_URL + '/api/parts/' + encodeURIComponent(DOC_PATH) + 
                      '/json?odd=' + ODD + '&amp;view=div&amp;xpath=' + encodeURIComponent(xpath);
            var el = document.getElementById(elementId);
            if (!el) return;
            el.innerHTML = '&lt;em&gt;Načítání…&lt;/em&gt;';
            
            fetch(url)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    /* TP API vrací JSON; HTML obsah bývá v poli "content" */
                    var html = data.content || data.html || data.body || '';
                    if (!html) { el.innerHTML = '&lt;pre&gt;' + JSON.stringify(data, null, 2) + '&lt;/pre&gt;'; return; }
                    el.innerHTML = html;
                })
                .catch(function(err) {
                    el.innerHTML = '&lt;p style="color:red"&gt;Chyba: ' + err.message + '&lt;/p&gt;';
                });
        }
        
        function loadBoth(unit) {
            loadWitness('content-ms', 'wit.ms_XIII', unit);
            loadWitness('content-renda', 'wit.renda_1581', unit);
        }
        
        function updateUI(unit) {
            var select = document.getElementById('unit-select');
            if (select) select.value = unit;
            var prev = document.getElementById('prev-unit');
            var next = document.getElementById('next-unit');
            if (prev) prev.disabled = parseInt(unit, 10) &lt;= MIN_UNIT;
            if (next) next.disabled = parseInt(unit, 10) &gt;= MAX_UNIT;
        }
        
        function goToUnit(unit) {
            var url = new URL(window.location);
            url.searchParams.set('n', unit);
            window.history.pushState({}, '', url);
            updateUI(unit);
            loadBoth(unit);
        }
        
        function navigateUnit(delta) {
            var current = parseInt(currentUnit(), 10);
            var target = current + delta;
            if (target &lt; MIN_UNIT || target &gt; MAX_UNIT) return;
            goToUnit(padUnit(target));
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            var unit = currentUnit();
            updateUI(unit);
            loadBoth(unit);
        });
        
        window.addEventListener('popstate', function() {
            var unit = currentUnit();
            updateUI(unit);
            loadBoth(unit);
        });
    /*  */
    </script>
</template>
