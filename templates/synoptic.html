<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        }
    }
    ---
    <style>
        .synoptic-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }
        .synoptic-grid h3 {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid #ccc;
            padding-bottom: .25rem;
        }
    </style>

    <div class="synoptic-grid">
        <div>
            <h3>Codex XIII (MS)</h3>
            <pb-view src="document1" xpath="//div[@type='witness'][@xml:id='msXIII']//div[@type='unit'][@n='01']" emit="transcription" subscribe="transcription"/>
        </div>
        <div>
            <h3>Renda 1581</h3>
            <pb-view src="document1" xpath="//div[@type='witness'][@xml:id='renda1581']//div[@type='unit'][@n='01']" emit="transcription" subscribe="transcription"/>
        </div>
    </div>
</template>
