<?xml version="1.0" encoding="UTF-8"?>
<template>
    [% template after %]
    [% if exists($context?doc) %]
    <div class="sidebar-info">
    <!---
        <section class="sidebar-section">
            <h5>Indices</h5>
            <ul class="sidebar-nav">
                <li><a href="[[ $context-path ]]/people"><pb-i18n key="menu.people">Persons</pb-i18n></a></li>
                <li><a href="[[ $context-path ]]/places"><pb-i18n key="menu.places">Places</pb-i18n></a></li>
            </ul>
        </section>
    -->
        <section class="sidebar-section">
            <h5>Edition</h5>
            <p class="sidebar-title">Vita Guilielmi – Digital Comparative Edition</p>
            <dl class="sidebar-meta">
                <dt>MS sec. XIII</dt>
                <dd>Abbey of Montevergine – Beneventan script (ff. 1–65) + Gothic minuscule (ff. 66–109)</dd>
                <dt>Renda 1581</dt>
                <dd>Editio princeps by Felice Renda – <em>Vita et obitu sancti Guilielmi</em></dd>
            </dl>
        </section>
    </div>
    [% endif %]
    [% endtemplate %]

    [% template scripts %]
    [% if $context?features?register?enabled %]
        [% if $script?webcomponents = 'dev' %]
        <script type="module" src="[[$script?cdn]]/src/pb-leaflet-map.js"/>
        [% elif $script?webcomponents = 'local' %]
        <script type="module" src="[[ $context-path ]]/resources/lib/pb-leaflet-map.js"/>
        [% elif $script?webcomponents = '' %]
        [% else %]
        <script type="module" src="[[$script?cdn]]@[[$script?webcomponents]]/dist/pb-leaflet-map.js"/>
        [% endif %]
    [% endif %]
    [% endtemplate %]

    [% template styles %]
    [% if exists($context?doc) %]
    <link rel="stylesheet" href="[[ $context-path ]]/resources/css/registers-theme.css"/>
    <style>
        .sidebar-info { padding: 1rem; font-size: .9rem; line-height: 1.5; }
        .sidebar-section { margin-bottom: 1.6rem; }
        .sidebar-section h5 {
            margin: 0 0 .5rem;
            font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
            color: #6b7280; font-weight: 600; border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem;
        }
        .sidebar-nav { list-style: none; padding: 0; margin: 0; }
        .sidebar-nav li { margin: .35rem 0; }
        .sidebar-nav a { color: #2563eb; text-decoration: none; font-size: .93rem; }
        .sidebar-nav a:hover { text-decoration: underline; }
        .sidebar-title { margin: 0 0 .6rem; font-weight: 600; color: #111827; font-size: .9rem; }
        .sidebar-meta { margin: 0; }
        .sidebar-meta dt { font-weight: 600; color: #374151; margin-top: .5rem; }
        .sidebar-meta dd { margin: 0 0 0 .8rem; color: #6b7280; font-size: .85rem; }
        /* Compact the "Metadata" heading from metadata-blocks.html (light DOM) */
        .metadata-panel { padding: 0 1rem 1rem; }
        .metadata-panel h2 {
            font-size: .72rem; text-transform: uppercase; letter-spacing: .07em;
            color: #6b7280; font-weight: 600;
            border-bottom: 1px solid #e5e7eb; padding-bottom: .3rem;
            margin: 0 0 .5rem;
        }
    </style>
    [% endif %]
    [% endtemplate %]
</template>
