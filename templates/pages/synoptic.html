<?xml version="1.0" encoding="UTF-8"?>
<template>
    ---json
    {
        "templating": {
            "extends": "templates/layouts/content.html"
        }
    }
    ---

    <main class="synoptic-page">

        <div class="syn-header">
            <h1 class="syn-brand">Legenda Sancti Guilielmi — Synoptic View</h1>
        </div>

        <nav class="unit-nav">
            <button id="prev-unit" onclick="navigateUnit(-1)">&#8592; Previous</button>
            <select id="unit-select" onchange="goToUnit(this.value)">
                <option value="01">Unit 01 — Prologus / Praefatio</option>
                <option value="02">Unit 02 — Incipit &amp; pueritia</option>
                <option value="03">Unit 03 — Peregrinatio &amp; faber</option>
                <option value="04">Unit 04 — Circuli ferrei</option>
                <option value="05">Unit 05 — Miraculum caeci</option>
                <option value="06">Unit 06 — Vocatio &amp; ignis</option>
                <option value="07">Unit 07 — Lorica &amp; cophia</option>
                <option value="08">Unit 08 — Fons &amp; ursus</option>
                <option value="09">Unit 09 — Edificatio ecclesiae</option>
            </select>
            <button id="next-unit" onclick="navigateUnit(1)">Next &#8594;</button>
            <button id="legend-toggle" onclick="toggleLegend()">&#9673; Legend</button>
        </nav>

        <div id="legend-panel" class="legend-panel" style="display:none">
            <div class="legend-grid">
                <div class="legend-item"><span class="legend-swatch miracle"></span><span>Miracle</span></div>
                <div class="legend-item"><span class="legend-swatch authorial"></span><span>Authorial / Moral</span></div>
                <div class="legend-item"><span class="legend-swatch ascetic"></span><span>Ascetic practice</span></div>
                <div class="legend-item"><span class="legend-swatch institutional"></span><span>Institutional / Political</span></div>
                <div class="legend-item"><span class="legend-swatch speech"></span><span>Speech / Dialogue</span></div>
                <div class="legend-item"><span class="legend-swatch conflict"></span><span>Conflict / Accusation</span></div>
                <div class="legend-item"><span class="legend-swatch narrative"></span><span>Narrative / Setting</span></div>
                <div class="legend-item"><span class="legend-swatch margin-note"></span><span>Margin note</span></div>
                <div class="legend-item"><span class="legend-swatch missing-sw"></span><span>Absent in this witness</span></div>
            </div>
        </div>

        <div id="unit-heading" class="unit-heading-block" style="display:none">
            <span id="unit-n-badge" class="unit-n-badge"></span>
            <span id="unit-title-text" class="unit-title-text"></span>
        </div>

        <div id="unit-intro" class="unit-intro" style="display:none"></div>

        <div class="syn-col-headers" id="syn-col-headers">
            <div class="syn-col-label ms-col">
                <abbr class="witness-badge ms-badge">MS</abbr>
                MS (13th century)
            </div>
            <div class="syn-col-label renda-col">
                <abbr class="witness-badge renda-badge">R</abbr>
                Renda (1581)
            </div>
        </div>

        <div id="synoptic-rows" class="synoptic-rows">
            <p class="syn-loading"><em>Loading&#8230;</em></p>
        </div>

    </main>

    <style>
        .synoptic-page { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #f3f4f6; min-height: 100vh; color: #111827; line-height: 1.55; }

        .syn-header { padding: 1rem 1.5rem .5rem; background: #fff; border-bottom: 1px solid #e5e7eb; }
        .syn-brand  { margin: 0; font-size: 1.1rem; font-weight: 800; color: #1d4ed8; }

        .unit-nav { display: flex; justify-content: center; align-items: center; gap: .75rem; padding: .75rem 1rem; background: #fff; border-bottom: 1px solid #e5e7eb; flex-wrap: wrap; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
        .unit-nav button { padding: .35rem .85rem; background: #fff; border: 1px solid #d1d5db; border-radius: 999px; cursor: pointer; font-size: .875rem; color: #374151; transition: background .15s, border-color .15s; }
        .unit-nav button:hover:not(:disabled) { background: #f3f4f6; border-color: #9ca3af; }
        .unit-nav button:disabled { opacity: .4; cursor: not-allowed; }
        #legend-toggle { border-color: #c4b5fd; color: #5b21b6; background: #faf5ff; }
        #legend-toggle:hover:not(:disabled) { background: #f5f3ff; border-color: #a78bfa; }
        .unit-nav select { padding: .4rem .75rem; min-width: 260px; border: 1px solid #d1d5db; border-radius: 8px; font-size: .875rem; color: #374151; background: #fff; }

        .legend-panel { background: #fff; border-bottom: 1px solid #e5e7eb; padding: .75rem 1.5rem; }
        .legend-grid  { display: flex; flex-wrap: wrap; gap: .55rem 1.5rem; max-width: 1600px; margin: 0 auto; }
        .legend-item  { display: flex; align-items: center; gap: .4rem; font-size: .81rem; color: #374151; }
        .legend-swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border-left: 4px solid; flex-shrink: 0; }
        .legend-swatch.miracle       { border-color: #7c3aed; background: #f5f3ff; }
        .legend-swatch.authorial     { border-color: #16a34a; background: #f0fdf4; }
        .legend-swatch.ascetic       { border-color: #d97706; background: #fffbeb; }
        .legend-swatch.institutional { border-color: #ea580c; background: #fff7ed; }
        .legend-swatch.speech        { border-color: #2563eb; background: #eff6ff; }
        .legend-swatch.conflict      { border-color: #ef4444; background: #fef2f2; }
        .legend-swatch.narrative     { border-color: #9ca3af; background: #f9fafb; }
        .legend-swatch.margin-note   { border-color: #a78bfa; background: #f5f3ff; }
        .legend-swatch.missing-sw    { border-color: #d1d5db; background: #f9fafb; opacity: .4; }

        .unit-intro { max-width: 1600px; margin: .75rem auto 0; padding: .7rem 1.1rem; background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 12px; color: #1e3a8a; font-size: .91em; line-height: 1.6; }

        .syn-col-headers { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; padding: .65rem 1.5rem .45rem; max-width: 1600px; margin: .65rem auto 0; position: sticky; top: 55px; z-index: 90; background: #f3f4f6; }
        .syn-col-label   { display: flex; align-items: center; gap: .5rem; padding: .45rem 1rem; border-radius: 10px; font-weight: 700; font-size: .875rem; color: #374151; border: 1px solid #e5e7eb; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.04); }
        .witness-badge   { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 6px; font-size: .72rem; font-weight: 800; font-style: normal; text-decoration: none; flex-shrink: 0; }
        .ms-badge    { background: #dbeafe; color: #1e40af; }
        .renda-badge { background: #fce7f3; color: #831843; }

        .synoptic-rows { display: flex; flex-direction: column; gap: .55rem; padding: .55rem 1.5rem 3rem; max-width: 1600px; margin: 0 auto; }

        .syn-row  { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; align-items: stretch; }
        .syn-cell { display: flex; flex-direction: column; min-height: 3rem; }
        .syn-cell > * { flex: 1; }

        .tei-seg1, .tei-seg2, .tei-seg3, .tei-seg4, .tei-seg5, .tei-seg6, .tei-seg7 { display: block !important; padding: .65rem .9rem !important; border-radius: 12px !important; border-left: 4px solid !important; margin: 0 !important; line-height: 1.6; font-size: .92rem; }
        .tei-seg1 { border-color: #7c3aed !important; background: #f5f3ff !important; }
        .tei-seg2 { border-color: #16a34a !important; background: #f0fdf4 !important; }
        .tei-seg3 { border-color: #d97706 !important; background: #fffbeb !important; }
        .tei-seg4 { border-color: #ea580c !important; background: #fff7ed !important; }
        .tei-seg5 { border-color: #2563eb !important; background: #eff6ff !important; }
        .tei-seg6 { border-color: #ef4444 !important; background: #fef2f2 !important; }
        .tei-seg7 { border-color: #9ca3af !important; background: #f9fafb !important; }

        .seg-type-label { display: inline-block; font-size: .67em; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-right: 5px; margin-bottom: 4px; vertical-align: middle; font-style: normal; background: #fff; letter-spacing: .02em; white-space: nowrap; }
        .tei-seg1 .seg-type-label { border: 1px solid #c4b5fd; color: #5b21b6; }
        .tei-seg2 .seg-type-label { border: 1px solid #bbf7d0; color: #166534; }
        .tei-seg3 .seg-type-label { border: 1px solid #fde68a; color: #92400e; }
        .tei-seg4 .seg-type-label { border: 1px solid #fed7aa; color: #9a3412; }
        .tei-seg5 .seg-type-label { border: 1px solid #bfdbfe; color: #1e40af; }
        .tei-seg6 .seg-type-label { border: 1px solid #fecaca; color: #991b1b; }
        .tei-seg7 .seg-type-label { border: 1px solid #e5e7eb; color: #374151; }

        .tei-note1 { display: block !important; border-left: 4px solid #a78bfa !important; background: #f5f3ff !important; padding: .65rem .9rem !important; border-radius: 12px !important; margin: 0 !important; font-size: .85em; color: #374151; font-style: italic; line-height: 1.55; }
        .tei-note1::before { content: "margin"; display: inline-block; font-size: .7em; padding: 2px 8px; border-radius: 999px; border: 1px solid #c4b5fd; background: #fff; color: #5b21b6; margin-right: 6px; vertical-align: middle; font-style: normal; font-weight: 700; }

        .seg-missing { display: flex !important; align-items: center; justify-content: space-between; gap: .5rem; opacity: .35; min-height: 3rem; }
        .seg-missing .seg-type-label { opacity: 1; flex-shrink: 0; }
        .missing-dash { flex: 1; text-align: center; font-size: 1.4em; color: #9ca3af; font-weight: 300; line-height: 1; }

        .syn-fallback      { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .syn-fallback-cell { background: #fff; border: 1px solid #e5e7eb; border-radius: 12px; padding: 1rem; font-size: .92rem; line-height: 1.6; }

        .tei-ab   { display: block; }
        .tei-div  { display: block; }
        .tei-head { display: block; margin: 0 0 .5rem; font-size: 1rem; font-weight: 700; color: #1d4ed8; }

        .syn-loading { text-align: center; padding: 3rem; color: #9ca3af; }
        .syn-error   { color: #ef4444; font-size: .9rem; padding: 1rem; background: #fef2f2; border-radius: 8px; margin: 1rem; }

        .unit-heading-block { max-width: 1600px; margin: .85rem auto 0; padding: .65rem 1.1rem; background: #fff; border: 1px solid #d1d5db; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04); display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
        .unit-n-badge { display: inline-block; padding: 3px 12px; border: 1px solid #d1d5db; border-radius: 999px; background: #f3f4f6; font-size: .88em; color: #111827; font-weight: 700; white-space: nowrap; }
        .unit-title-text { font-weight: 700; color: #1d4ed8; font-size: 1.05rem; }

        @media (max-width: 900px) {
            .syn-col-headers { grid-template-columns: 1fr; position: static; }
            .syn-row, .syn-fallback { grid-template-columns: 1fr; }
            .synoptic-rows, .unit-intro, .unit-heading-block { padding-left: 1rem; padding-right: 1rem; }
        }
    </style>

    <script>
    /*<![CDATA[*/

        var MIN_UNIT = 1, MAX_UNIT = 9;
        var DOC_PATH = 'vita-guilielmi/vita-guilielmi.xml';
        var ODD      = 'vita-guilielmi';
        var BASE_URL = '/exist/apps/vita-guilielmi';

        var UNIT_INTROS = {
            '01': 'Prologus/Praefatio: the MS frames writing as moral edification and a curative response to a present crisis; Renda opens with an accumulative celebration of Montevergine as a visible sacred city.',
            '02': 'Incipit and early formation: both texts share the nobilitas-topos, but the MS emphasizes inner rumination and rational detachment, whereas Renda streamlines motivation and accelerates narrative action.',
            '03': 'Peregrinatio and the blacksmith: in the MS, authority is grounded in obedience and spiritual submission; in Renda, the episode becomes more navigable, supported by paratext and a more externalized rhetoric of legitimacy.',
            '04': 'The iron hoops: technical description is closely shared, yet the MS builds secrecy as a narrative ethic, while Renda shifts interpretive force to the margin and to rapid moral decoding.',
            '05': 'The blind man\'s miracle: both preserve the prodigy and the saint\'s refusal of personal glory, but the MS expands the episode into a fuller drama of humility and reputation, whereas Renda segments it as a discrete miracle unit.',
            '06': 'Vocational unit (Ioannes – brigands – vision in fire): a highly stable narrative sequence; Renda strengthens the turning point through paratext and compresses connective tissue.',
            '07': 'Lorica and cophia: the MS foregrounds invisibility and fear of praise as moral strategy; Renda retains the ascetic armament but favours a quicker penitential reading.',
            '08': 'The spring and the bear: the MS integrates the prodigy into eremitic routine (damage–repair–repetition–rebuke), while Renda adds an empirical search/persistence prelude.',
            '09': 'Monte Virgiliano and institutional tension: the MS centres communal economy and the ensuing conflict, culminating in William\'s speech and departure; Renda reframes the same cluster within a broader institutional narrative.'
        };

        var UNIT_TITLES = {
            '01': 'Prologus / Praefatio',
            '02': 'Incipit & pueritia',
            '03': 'Peregrinatio & faber',
            '04': 'Circuli ferrei',
            '05': 'Miraculum caeci',
            '06': 'Vocatio & ignis',
            '07': 'Lorica & cophia',
            '08': 'Fons & ursus',
            '09': 'Edificatio ecclesiae'
        };

        /* @type → CSS class (mirrors ODD predicates) */
        var TYPE_TO_CLASS = {
            'miracle-event':'tei-seg1','miracle-status':'tei-seg1','miracle-response':'tei-seg1',
            'miracle-builder':'tei-seg1','miracle-mute':'tei-seg1','miracle-wolf':'tei-seg1',
            'authorial-stance':'tei-seg2','authorial-fear':'tei-seg2','purpose-writing':'tei-seg2',
            'mandate-writing':'tei-seg2','burden-writing':'tei-seg2','saint-representation':'tei-seg2',
            'moral-diagnosis':'tei-seg2','moral-certification':'tei-seg2',
            'ascetic-practice':'tei-seg3','ascetic-defense':'tei-seg3','ascetic-crisis':'tei-seg3',
            'humility-defense':'tei-seg3','penitential-limit':'tei-seg3','lorica-intent':'tei-seg3',
            'lorica-acquisition':'tei-seg3','lorica-secrecy':'tei-seg3','cophia-acquisition':'tei-seg3',
            'cophia-secrecy':'tei-seg3','habit-assumptio':'tei-seg3','interior-discipline':'tei-seg3',
            'patience-limit':'tei-seg3','active-sanctity':'tei-seg3','rational-detachment':'tei-seg3',
            'hospitality-ritual':'tei-seg3','technical-description':'tei-seg3',
            'institutional-display':'tei-seg4','institutional-legitimation':'tei-seg4',
            'political-legitimation':'tei-seg4','liturgical-integration':'tei-seg4',
            'foundation':'tei-seg4','dedication-frame':'tei-seg4','completion-and-supply':'tei-seg4',
            'post-dedication-building':'tei-seg4','exemptio':'tei-seg4','nobilitas-topos':'tei-seg4',
            'offerings':'tei-seg4','dispensatio':'tei-seg4',
            'speech':'tei-seg5','pastoral-argument':'tei-seg5','spiritual-dialogue':'tei-seg5',
            'holy-rebuke':'tei-seg5',
            'escalation':'tei-seg6','accusation':'tei-seg6','presbyters-request':'tei-seg6',
            'fear-of-poverty':'tei-seg6',
            'incipit':'tei-seg7','textual-closure':'tei-seg7','encounter':'tei-seg7',
            'itinerary':'tei-seg7','setting':'tei-seg7','forced-return':'tei-seg7',
            'departure':'tei-seg7','discovery-ritual':'tei-seg7','divine-revelation':'tei-seg7',
            'discernment-climax':'tei-seg7','empirical-search':'tei-seg7','persistence':'tei-seg7',
            'discovery-damage':'tei-seg7','restoration-labor':'tei-seg7','iterative-struggle':'tei-seg7',
            'response-intro':'tei-seg7','historical-context':'tei-seg7','settlement-context':'tei-seg7',
            'immediate-departure':'tei-seg7','resolute-action':'tei-seg7','petition':'tei-seg7',
            'scenography-contemplative':'tei-seg7','meditative-rumination':'tei-seg7',
            'civil-episode':'tei-seg7',
            'margin-note':'tei-note1'
        };

        function getSegClass(typeKey) {
            return TYPE_TO_CLASS[typeKey] || 'tei-seg7';
        }

        /* Fetch one witness and return its HTML string (empty string on any failure) */
        function fetchWitness(witnessId, unit) {
            var xpath = "//tei:text[@xml:id='" + witnessId + "']//tei:div[@type='unit'][@n='" + unit + "']";
            var url = BASE_URL + '/api/parts/' + encodeURIComponent(DOC_PATH) +
                '/json?odd=' + ODD + '&view=div&xpath=' + encodeURIComponent(xpath);
            return fetch(url)
                .then(function(r) {
                    if (!r.ok) {
                        console.warn('Synoptic: HTTP ' + r.status + ' for ' + witnessId + ' unit ' + unit);
                        return '';
                    }
                    return r.text().then(function(txt) {
                        /* Try JSON parse; fall back to treating the whole body as HTML */
                        try {
                            var d = JSON.parse(txt);
                            if (typeof d === 'string') return d;
                            return d.content || d.html || d.body || d.data || '';
                        } catch (e) {
                            /* Not JSON – maybe raw HTML from an old TP endpoint */
                            return txt;
                        }
                    });
                })
                .catch(function(err) {
                    console.warn('Synoptic: fetch error for ' + witnessId + ' unit ' + unit, err);
                    return '';
                });
        }

        /* Extract top-level typed segment elements in document order */
        function extractSegs(container) {
            var segs = [];
            var nodes = container.querySelectorAll('[class*="tei-type-"], .tei-note1');
            nodes.forEach(function(el) {
                /* Skip elements nested inside another typed block */
                var anc = el.parentElement;
                while (anc && anc !== container) {
                    var cn = anc.className || '';
                    if (cn.indexOf('tei-type-') !== -1 || cn.indexOf('tei-note1') !== -1) { return; }
                    anc = anc.parentElement;
                }
                var typeKey;
                if (el.classList.contains('tei-note1')) {
                    typeKey = 'margin-note';
                } else {
                    var parts = el.className.split(' ');
                    var tc = '';
                    for (var k = 0; k < parts.length; k++) {
                        if (parts[k].indexOf('tei-type-') === 0) { tc = parts[k]; break; }
                    }
                    typeKey = tc ? tc.replace('tei-type-', '') : 'unknown';
                }
                segs.push({ typeKey: typeKey, element: el });
            });
            return segs;
        }

        /* Inject visible .seg-type-label pill into each segment block */
        function injectLabels(segs) {
            segs.forEach(function(seg) {
                if (seg.element.classList.contains('tei-note1')) { return; }
                var old = seg.element.querySelector('.seg-type-label');
                if (old) { old.parentNode.removeChild(old); }
                var lbl = document.createElement('span');
                lbl.className = 'seg-type-label';
                lbl.textContent = seg.typeKey;
                seg.element.insertBefore(lbl, seg.element.firstChild);
            });
        }

        /* LCS-based alignment: match same-@type segments across witnesses */
        function lcsAlign(msSegs, rendaSegs) {
            var n = msSegs.length, m = rendaSegs.length;
            var i, j, k;
            var dp = [];
            for (i = 0; i <= n; i++) {
                dp[i] = [];
                for (k = 0; k <= m; k++) { dp[i][k] = 0; }
            }
            for (i = 1; i <= n; i++) {
                for (j = 1; j <= m; j++) {
                    if (msSegs[i-1].typeKey === rendaSegs[j-1].typeKey) {
                        dp[i][j] = dp[i-1][j-1] + 1;
                    } else {
                        dp[i][j] = dp[i-1][j] > dp[i][j-1] ? dp[i-1][j] : dp[i][j-1];
                    }
                }
            }
            var rows = [];
            i = n; j = m;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0 && msSegs[i-1].typeKey === rendaSegs[j-1].typeKey) {
                    rows.unshift({ typeKey: msSegs[i-1].typeKey, ms: msSegs[i-1], renda: rendaSegs[j-1] });
                    i--; j--;
                } else if (j > 0 && (i === 0 || dp[i][j-1] >= dp[i-1][j])) {
                    rows.unshift({ typeKey: rendaSegs[j-1].typeKey, ms: null, renda: rendaSegs[j-1] });
                    j--;
                } else {
                    rows.unshift({ typeKey: msSegs[i-1].typeKey, ms: msSegs[i-1], renda: null });
                    i--;
                }
            }
            return rows;
        }

        /* Build a dimmed placeholder for an absent witness segment */
        function makePlaceholder(typeKey) {
            var div = document.createElement('div');
            div.className = getSegClass(typeKey) + ' seg-missing tei-type-' + typeKey;
            if (typeKey !== 'margin-note') {
                var lbl = document.createElement('span');
                lbl.className = 'seg-type-label';
                lbl.textContent = typeKey;
                div.appendChild(lbl);
            }
            var dash = document.createElement('span');
            dash.className = 'missing-dash';
            dash.textContent = '—';
            div.appendChild(dash);
            return div;
        }

        /* Render the aligned row grid into #synoptic-rows */
        function renderRows(rows, container) {
            container.innerHTML = '';
            if (rows.length === 0) {
                container.innerHTML = '<p class="syn-loading"><em>No segmented content for this unit.</em></p>';
                return;
            }
            rows.forEach(function(row) {
                var rowEl = document.createElement('div');
                rowEl.className = 'syn-row';

                var msCell = document.createElement('div');
                msCell.className = 'syn-cell syn-ms';
                msCell.appendChild(row.ms ? row.ms.element.cloneNode(true) : makePlaceholder(row.typeKey));

                var rendaCell = document.createElement('div');
                rendaCell.className = 'syn-cell syn-renda';
                rendaCell.appendChild(row.renda ? row.renda.element.cloneNode(true) : makePlaceholder(row.typeKey));

                rowEl.appendChild(msCell);
                rowEl.appendChild(rendaCell);
                container.appendChild(rowEl);
            });
        }

        /* Fallback: plain two-column display when no typed segs exist */
        function renderFallback(msHtml, rendaHtml, container) {
            container.innerHTML = '';
            var wrap = document.createElement('div');
            wrap.className = 'syn-fallback';
            var mc = document.createElement('div');
            mc.className = 'syn-fallback-cell';
            mc.innerHTML = msHtml || '<em style="color:#9ca3af">No content</em>';
            var rc = document.createElement('div');
            rc.className = 'syn-fallback-cell';
            rc.innerHTML = rendaHtml || '<em style="color:#9ca3af">No content</em>';
            wrap.appendChild(mc);
            wrap.appendChild(rc);
            container.appendChild(wrap);
        }

        /* Fetch, align, and render both witnesses for a given unit */
        function loadBoth(unit) {
            var container = document.getElementById('synoptic-rows');
            if (!container) { return; }
            container.innerHTML = '<p class="syn-loading"><em>Loading…</em></p>';

            Promise.all([
                fetchWitness('wit.ms_XIII', unit),
                fetchWitness('wit.renda_1581', unit)
            ]).then(function(results) {
                var msHtml    = results[0];
                var rendaHtml = results[1];

                console.log('Synoptic unit ' + unit + ': MS html length=' + msHtml.length + ', Renda html length=' + rendaHtml.length);

                var msTemp = document.createElement('div');
                msTemp.innerHTML = msHtml;
                var rendaTemp = document.createElement('div');
                rendaTemp.innerHTML = rendaHtml;

                var msSegs    = extractSegs(msTemp);
                var rendaSegs = extractSegs(rendaTemp);

                console.log('Synoptic unit ' + unit + ': MS segs=' + msSegs.length + ', Renda segs=' + rendaSegs.length);

                if (msSegs.length === 0 && rendaSegs.length === 0) {
                    renderFallback(msHtml, rendaHtml, container);
                    return;
                }

                injectLabels(msSegs);
                injectLabels(rendaSegs);

                var rows = lcsAlign(msSegs, rendaSegs);
                renderRows(rows, container);
            }).catch(function(err) {
                var msg = err && err.message ? err.message : String(err);
                container.innerHTML = '<p class="syn-error">Error loading unit ' + unit + ': ' + msg + '</p>';
                console.error('Synoptic error unit ' + unit, err);
            });
        }

        /* ── Navigation ── */
        function padUnit(n) { return String(n).padStart(2, '0'); }

        function currentUnit() {
            return new URLSearchParams(window.location.search).get('n') || '01';
        }

        function showIntro(unit) {
            var el = document.getElementById('unit-intro');
            if (!el) { return; }
            var txt = UNIT_INTROS[unit];
            if (txt) { el.textContent = txt; el.style.display = 'block'; }
            else      { el.style.display = 'none'; }
        }

        function showUnitHeading(unit) {
            var el    = document.getElementById('unit-heading');
            var badge = document.getElementById('unit-n-badge');
            var title = document.getElementById('unit-title-text');
            if (!el) { return; }
            if (badge) { badge.textContent = 'Unit ' + unit; }
            if (title) { title.textContent = UNIT_TITLES[unit] ? '— ' + UNIT_TITLES[unit] : ''; }
            el.style.display = 'flex';
        }

        function updateUI(unit) {
            var sel  = document.getElementById('unit-select');
            var prev = document.getElementById('prev-unit');
            var next = document.getElementById('next-unit');
            if (sel)  { sel.value = unit; }
            if (prev) { prev.disabled = parseInt(unit, 10) <= MIN_UNIT; }
            if (next) { next.disabled = parseInt(unit, 10) >= MAX_UNIT; }
        }

        function goToUnit(unit) {
            var url = new URL(window.location);
            url.searchParams.set('n', unit);
            window.history.pushState({}, '', url);
            updateUI(unit);
            showUnitHeading(unit);
            showIntro(unit);
            loadBoth(unit);
        }

        function navigateUnit(delta) {
            var cur    = parseInt(currentUnit(), 10);
            var target = cur + delta;
            if (target < MIN_UNIT || target > MAX_UNIT) { return; }
            goToUnit(padUnit(target));
        }

        function toggleLegend() {
            var panel = document.getElementById('legend-panel');
            if (!panel) { return; }
            panel.style.display = (panel.style.display === 'none') ? 'block' : 'none';
        }

        document.addEventListener('DOMContentLoaded', function() {
            var unit = currentUnit();
            updateUI(unit);
            showUnitHeading(unit);
            showIntro(unit);
            loadBoth(unit);
        });

        window.addEventListener('popstate', function() {
            var unit = currentUnit();
            updateUI(unit);
            showUnitHeading(unit);
            showIntro(unit);
            loadBoth(unit);
        });

    /*]]>*/
    </script>

</template>
